name: datahub
description: DataHub is a Cloud Development Ecosystem aiming to bring the power of Dart into the Cloud.
version: 0.17.0-dev.75
homepage: https://datahubproject.net/

environment:
  sdk: ^3.1.0

executables:
  datahub:

dependencies:
  args: ^2.5.0
  boost: ^1.8.10
  dart_amqp: ^0.3.1
  http: ^0.13.6
  http2: ^2.0.0
  intl: ^0.17.0
  path: ^1.8.2
  pointycastle: ^3.9.1
  rxdart: ^0.28.0
  uuid: ^4.4.0
  yaml: ^3.1.1
  # flutter_test depends on test_api: 0.7.0, so 1.25.2 is max version for now
  test: ^1.25.2
  minio: ^3.5.0

dev_dependencies:
  build_runner: ^2.4.11
  datahub_codegen: ^0.17.0-dev.22
  lints: ^4.0.0

false_secrets:
  - test/resource_hub/localhost.crt
  - test/resource_hub/localhost.key
