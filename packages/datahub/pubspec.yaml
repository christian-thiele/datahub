name: datahub
description: DataHub is a Cloud Development Ecosystem aiming to bring the power of Dart into the Cloud.
version: 0.18.0-dev.15
homepage: https://datahubproject.net/
resolution: workspace

environment:
  sdk: ^3.9.0

executables:
  datahub:

dependencies:
  args: ^2.5.0
  boost: ^2.0.0
  http: ^1.0.0
  http2: ^2.0.0
  intl: ^0.20.0
  path: ^1.8.2
  pointycastle: ^4.0.0
  rxdart: ^0.28.0
  uuid: ^4.4.0
  yaml: ^3.1.1
  # flutter_test pins test_api: 0.7.6, so 1.26.2 is max version for flutter compatibility
  test: ^1.26.2
  protobuf: ^5.0.0
  fixnum: ^1.1.0
  stack_trace: ^1.11.1
  grpc: ^4.3.1
  meta: ^1.16.0
  buffer: ^1.2.3
  cryptography: ^2.7.0

dev_dependencies:
  datahub_codegen: ^0.18.0-dev.4
  lints: ^6.0.0
  build_runner: ^2.7.1

false_secrets:
  - test/resource_hub/localhost.crt
  - test/resource_hub/localhost.key
