<!DOCTYPE html>
<html lang="{{lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <link rel="icon" href="data:,">
  <style>
    @font-face {
      font-family: Poppins;
      src: url("{{font}}") format("truetype");
    }

    :root {
      --primary: {{primary}};
      --error: {{error}};
      --surface: {{surface}};
      --on-surface: {{onSurface}};
      --shadow: {{shadow}};
      --logo-color: {{logoColor}};
      --logo-width: {{logoWidth}};
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      margin: 0;
      background: var(--surface);
      color: var(--on-surface);
      font: 14px / 1.5 Poppins, sans-serif;
      letter-spacing: 0.5px;
    }

    .success {
      --accent: var(--primary);
    }

    .error {
      --accent: var(--error);
    }

    header {
      display: flex;
      align-items: center;
      height: 84px;
      padding: 0 24px;
      background: var(--surface);
      box-shadow: 0 0 2px var(--shadow);
    }

    .logo {
      width: var(--logo-width);
      height: 48px;
      object-fit: scale-down;
      filter: url(#tint);
    }

    #tint feFlood {
      flood-color: var(--logo-color);
    }

    main {
      display: flex;
      flex: 1;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 16px;
      text-align: center;
    }

    .icon {
      width: 48px;
      height: 48px;
      fill: var(--accent);
    }

    .success .icon-error,
    .error .icon-success {
      display: none;
    }

    h1 {
      margin: 0;
      color: var(--accent);
      font-size: 22px;
      font-weight: 400;
      line-height: 28px;
      letter-spacing: 0;
    }

    p {
      max-width: 512px;
      margin: 0;
    }
  </style>
</head>
<body class="{{status}}">
<svg width="0" height="0" aria-hidden="true">
  <filter id="tint" color-interpolation-filters="sRGB">
    <feFlood/>
    <feComposite in2="SourceAlpha" operator="in"/>
  </filter>
</svg>
<header>
  <img class="logo" src="{{logo}}" alt="{{title}}">
</header>
<main>
  <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
    <path class="icon-success"
          d="M16.59 7.58 10 14.17l-3.59-3.58L5 12l5 5 8-8zM12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8z"/>
    <path class="icon-error"
          d="M11 15h2v2h-2zm0-8h2v6h-2zm.99-5C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8z"/>
  </svg>
  <h1>{{headline}}</h1>
  <p>{{message}}</p>
</main>
</body>
</html>
