name: datahub_aperture_frontend
description: "DataHub Aperture Frontend"
resolution: workspace

publish_to: 'none'

version: 0.1.0-dev.4

environment:
  sdk: ^3.9.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/
    - google_fonts/

flutter_intl:
  enabled: true

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  app_links: ^7.0.0
  cupertino_icons: ^1.0.9
  google_fonts: ^8.1.0
  go_router: ^17.2.2
  flutter_bloc: ^9.1.1
  bloc: ^9.2.0
  flutter_svg: ^2.2.4
  shared_preferences: ^2.5.3
  boost: ^2.0.0
  intl: ^0.20.0
  file_picker: ^11.0.2
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  geojson_vi: ^2.2.5

  datahub: ^0.18.0-dev.16
  datahub_aperture: ^0.1.0-dev.7
  url_launcher: ^6.3.2
  pointycastle: ^4.0.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0