name: Tests

on:
  push:
    branches:
      - main
      - version/*
  pull_request:
    branches:
      - main
      - version/*

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Dart & Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: dart run melos analyze

      - name: Test
        run: dart run melos test