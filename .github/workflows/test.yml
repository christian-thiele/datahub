name: Tests

on:
  push:
    branches:
      - main
      - version/*
  pull_request:
    branches:
      - main
      - version/*

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Analyze
        run: dart run melos analyze

      - name: Test
        run: dart run melos test