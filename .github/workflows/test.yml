name: Tests

on:
  push:
    branches:
      - main
      - version/*
  pull_request:
    branches:
      - main
      - version/*

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Dart & Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Setup Melos
        uses: bluefireteam/melos-action@v3

      - name: Install dependencies
        run: dart pub get

      - name: Analyze
        run: melos analyze

      - name: Test
        run: melos test
