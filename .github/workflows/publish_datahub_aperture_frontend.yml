name: Publish datahub_aperture_frontend image to ghcr.io

on:
  push:
    tags:
      - 'release/datahub_aperture_frontend/*'

jobs:
  test:
    name: Run Tests
    uses: ./.github/workflows/test.yml

  publish:
    name: Publish Package
    needs: test
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Extract version from tag
        id: tag
        run: echo "version=${GITHUB_REF##*/}" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: packages/datahub_aperture_frontend/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/christian-thiele/datahub_aperture_frontend:latest
            ghcr.io/christian-thiele/datahub_aperture_frontend:${{ steps.tag.outputs.version }}
